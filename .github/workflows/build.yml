name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: MotionJoyTrackingGenerator-windows.exe
          - os: macos-latest
            asset: MotionJoyTrackingGenerator-macos-arm64.zip
          - os: ubuntu-latest
            asset: MotionJoyTrackingGenerator-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install psutil pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --windowed --onefile --name MotionJoyTrackingGenerator main.py
          move dist\MotionJoyTrackingGenerator.exe dist\${{ matrix.asset }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name MotionJoyTrackingGenerator main.py
          ditto -c -k --keepParent dist/MotionJoyTrackingGenerator.app dist/${{ matrix.asset }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --name MotionJoyTrackingGenerator main.py
          mv dist/MotionJoyTrackingGenerator dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
